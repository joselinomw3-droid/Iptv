name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Descompactar projeto Android
        run: |
          rm -rf project
          mkdir project
          unzip -q IPTVPlayer-Android-Project.zip -d project

      - name: Mostrar estrutura do projeto
        run: |
          echo "Arquivos encontrados:"
          find project -maxdepth 5 -type f | sort | head -200

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar projeto Gradle
        id: gradle_project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            echo "Estrutura encontrada:"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Gradle encontrado em:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar Gradle
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew não encontrado. Criando wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew

      - name: Gerar APK
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find project -type f -name "*.apk" -print

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error